# Render service definition (decision D15).
#
# This file lets Render recreate the service from scratch ("Blueprint"), and it
# documents the exact settings if you create the service by hand in the
# dashboard instead. Either route works.
services:
  - type: web
    name: graphrag
    runtime: python
    plan: free
    branch: master

    buildCommand: pip install -r requirements.txt

    # --host 0.0.0.0 listens on all interfaces, and $PORT is the port Render
    # assigns. Binding 127.0.0.1 or a fixed port produces a service that runs
    # perfectly and answers nobody - the classic broken deploy.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

    # Render pings this to decide whether the service came up.
    healthCheckPath: /api/health

    envVars:
      # sync: false means "ask me for this value, never store it in git".
      # Set it in Render's Environment tab.
      - key: GEMINI_API_KEY
        sync: false

      # Not secret - pinned here so a fresh deploy can't silently fall back to
      # config.py's default (now empty on purpose, so it fails loudly instead)
      # the way an unset GEMINI_ANSWER_MODEL once let Render fall back to a
      # hardcoded model since found to hang on free tier. Re-run
      # `python -m app.llm.models --write` if either stops being offered.
      - key: GEMINI_ANSWER_MODEL
        value: gemini-3-flash-preview
      - key: GEMINI_ANSWER_FALLBACK_MODEL
        value: gemini-3.5-flash

      # The app refuses to start without this (D11).
      - key: APP_PASSWORD
        sync: false

      # Signs the session cookie. Render can generate it; a stable value means
      # sessions survive the restarts that free-tier sleep causes.
      - key: SESSION_SECRET
        generateValue: true

      # Render terminates TLS at its edge, so the socket peer is its proxy.
      # Without this, every visitor shares one rate-limit bucket.
      - key: GRAPHRAG_TRUST_PROXY
        value: "true"

      # Production is https, so the session cookie must be https-only.
      - key: GRAPHRAG_COOKIE_SECURE
        value: "true"

      # Added in later phases; listed here so the set is visible in one place.
      # - key: NEO4J_URI
      #   sync: false
      # - key: NEO4J_USERNAME
      #   sync: false
      # - key: NEO4J_PASSWORD
      #   sync: false
      # - key: APP_PASSWORD
      #   sync: false
      # - key: SESSION_SECRET
      #   generateValue: true
